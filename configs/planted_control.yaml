# Planted-regime positive control (PC-1c-R) configuration
# See SPECTRAL_DISTILLATION_IMPLEMENTATION_GUIDE.md §6.5.

planted_control:
  n_nodes: 10000
  n_classes: 5
  n_patches: 50
  regime_ratio: [0.4, 0.4, 0.2]    # L (homophilic), H (anti-correlated), M (random)
  dilution_values: [0.0, 0.25, 0.5, 0.75, 1.0]

  # Deconfounding invariants (all must hold; automated instrument gates)
  invariants:
    feature_noise_constant_across_ladder: true
    nested_converted_node_sets: true
    unconverted_nodes_retain_original: true
    no_arm_saturates: true          # single-M expert accuracy ~ 0.80 on M-nodes

protocol:
  n_splits: 10
  n_seeds: 3
  statistical_test: "wilcoxon"
  correction: "holm"